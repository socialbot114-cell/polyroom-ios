name: Polyroom
options:
  bundleIdPrefix: com.polyroom
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
targets:
  Polyroom:
    type: application
    platform: iOS
    sources:
      - path: Polyroom/Sources
      - path: Polyroom/LaunchScreen.storyboard
    resources:
      - path: Polyroom/Resources/catalog.json
      - path: Polyroom/Resources/Sounds
        type: folder
      - path: ../thumbnails
        type: folder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.polyroom.app
        PRODUCT_NAME: Polyroom
        INFOPLIST_FILE: Polyroom/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) POLYROOM_APP_ENTRY"
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
  PolyroomTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Polyroom/Tests
    dependencies:
      - target: Polyroom
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.polyroom.app.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Polyroom:
    build:
      targets:
        Polyroom: all
        PolyroomTests: [test]
    test:
      config: Debug
      targets:
        - PolyroomTests
