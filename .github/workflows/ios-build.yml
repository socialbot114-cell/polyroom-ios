name: ios-build
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 16
        run: sudo xcode-select -s /Applications/Xcode_16.2.app
      - name: Show versions
        run: xcodebuild -version && swift --version
      - name: Compile Swift package + run model/UI-logic tests
        run: swift test --package-path ios-app/Polyroom
      - name: Generate Xcode project
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then brew install xcodegen; fi
          xcodegen generate --spec ios-app/project.yml --project ios-app
      - name: Build app for iOS Simulator SDK
        run: xcodebuild -project ios-app/Polyroom.xcodeproj -scheme Polyroom -destination 'generic/platform=iOS Simulator' -derivedDataPath build/DerivedData build CODE_SIGNING_ALLOWED=NO
      - name: Validate catalog
        run: python3 tools/check_catalog.py
